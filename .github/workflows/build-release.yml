name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist/GlobalProtectorWiFi.exe,dist/README.md,dist/LICENSE,dist/SHA256SUMS.txt -DestinationPath dist/GlobalProtectorWiFi-portable.zip
          git archive --format=zip --output=dist/GlobalProtectorWiFi-source.zip HEAD
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS.txt -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalProtectorWiFi-Windows
          path: dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $releaseArgs=@('release','create',$env:RELEASE_TAG,'dist/GlobalProtectorWiFi.exe','dist/GlobalProtectorWiFi-portable.zip','dist/GlobalProtectorWiFi-source.zip','dist/SHA256SUMS.txt','--title',('Global Protector WiFi '+$env:RELEASE_TAG),'--notes-file','docs/RELEASE_NOTES.md')
          if($env:RELEASE_TAG -match '-'){$releaseArgs+='--prerelease'}else{$releaseArgs+='--latest'}
          & gh @releaseArgs
          if($LASTEXITCODE -ne 0){throw 'GitHub release publication failed.'}
